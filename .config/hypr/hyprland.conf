# ~/.config/hypr/hyprland.conf
# CORRECTED VERSION 3 - 03 Sep 2025

################
### MONITORS ###
################
monitor=,preferred,auto,1.25

#############################
### AUTOSTART & DAEMONS ###
#############################
exec-once = waybar
exec-once = swww-daemon --format xrgb
exec-once = sleep 1 && swww img ~/Pictures/Wallpapers/your-wallpaper.png # <-- SET YOUR WALLPAPER HERE
exec-once = mako
exec-once = wl-paste --watch cliphist store

#################
### ENV VARS ###
#################
env = XCURSOR_SIZE,24
env = SHELL,/usr/bin/zsh

#############################
### THEME & APPEARANCE ###
#############################

# Sourcing colors from your brightGruvbox theme
# FIX 1: Defined the full rgba values in variables to make parsing foolproof.
$active_border = rgba(e199b8ff)
$inactive_border = rgba(665c54aa)

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2

    # Using the new robust color variables
    col.active_border = $active_border
    col.inactive_border = $inactive_border

    layout = dwindle
}

decoration {
    rounding = 8

    blur {
        enabled = true
        size = 5
        passes = 2
        # new_optimizations & xray are for newer Hyprland versions.
        # Keeping them commented out for compatibility.
        # new_optimizations = true
        # xray = true
    }

    # FIX 3: Your version of Hyprland does not have these shadow options.
    # Removing them will fix the startup errors.

}

animations {
    enabled = true

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default, slide
    animation = specialWorkspace, 1, 6, myBezier, slidevert
}

##################
### INPUT ###
##################
input {
    kb_layout = us
    follow_mouse = 1

    touchpad {
        natural_scroll = true
    }

    sensitivity = 0
}

gestures {
    workspace_swipe = true
}

##################
### LAYOUTS ###
##################
dwindle {
    pseudotile = true
    preserve_split = true
}

#######################
### WINDOW RULES ###
#######################
windowrulev2 = float, class:^(Dolphin)$
windowrulev2 = size 50% 60%, class:^(Dolphin)$
windowrulev2 = center, class:^(Dolphin)$


####################
### KEYBINDINGS ###
####################
$mainMod = SUPER

# --- Apps ---
bind = $mainMod, Return, exec, alacritty
bind = $mainMod, D, exec, wofi --show drun
bind = $mainMod, E, exec, dolphin

# --- Window Management ---
bind = $mainMod, Q, killactive,
bind = $mainMod, F, fullscreen, 0
bind = $mainMod, V, togglefloating,
bind = $mainMod, P, pseudo,
bind = $mainMod, J, togglesplit,

# --- Focus & Move Windows ---
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

# --- Resize Windows (with keyboard) ---
binde = $mainMod ALT, right, resizeactive, 10 0
binde = $mainMod ALT, left, resizeactive, -10 0
binde = $mainMod ALT, up, resizeactive, 0 -10
binde = $mainMod ALT, down, resizeactive, 0 10

# --- Workspaces ---
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5

# --- Special Workspace (Scratchpad) ---
bind = $mainMod, S, togglespecialworkspace,
bind = $mainMod SHIFT, S, movetoworkspace, special

# --- Mouse and Scroll ---
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# --- System Utilities ---
bind = $mainMod, L, exec, swaylock
bind = $mainMod, M, exit,
bind = , Print, exec, grim -g "$(slurp)" - | wl-copy
bind = $mainMod, Print, exec, grim - | wl-copy
bind = $mainMod, C, exec, hyprpicker | wl-copy

# --- Media Keys ---
binde=, XF86AudioRaiseVolume, exec, pamixer -i 5
binde=, XF86AudioLowerVolume, exec, pamixer -d 5
bind =, XF86AudioMute, exec, pamixer -t
binde=, XF86MonBrightnessUp, exec, brightnessctl set 5%+
binde=, XF86MonBrightnessDown, exec, brightnessctl set 5%-


